name: AURU Pocket Core v0.8.0 publication guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Publication disabled until verified artifact is promoted
        run: |
          echo "v0.8 publication is intentionally disabled here."
          echo "Do not use temporary artifact URLs."
          echo "Promote only the verified GenesisUniversum artifact after end-to-end checks."
