name: Publish AURU Pocket Core v0.8.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified signed APK artifact
        env:
          SOURCE_ZIP: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-6ba0-8246-8546-8d1aaa78295f/raw?se=2026-08-16T19%3A04%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=c5a89878-9740-5544-abfc-820451bcbac7&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T06%3A52%3A00Z&ske=2026-08-17T06%3A52%3A00Z&sks=b&skv=2026-02-06&sig=M5hkZ8JA/pG0SiIdDW1Iveol19OTqavkadULZNLDY/w%3D"
          EXPECTED_SHA256: "8f1762d557faf9fa22b84dfdeb25a0624b5254cf4f2bff3c589dbe01ff3a290b"
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_ZIP" -o /tmp/auru-v080.zip
          mkdir -p /tmp/auru-v080
          unzip -q /tmp/auru-v080.zip -d /tmp/auru-v080
          APK="$(find /tmp/auru-v080 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/AURU-Pocket-Core-v0.8.0.apk"
          echo "$EXPECTED_SHA256  $GITHUB_WORKSPACE/AURU-Pocket-Core-v0.8.0.apk" | sha256sum -c -

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="Aurucoin/AI_MUZG"
          if gh release view v0.8.0 --repo "$REPO" >/dev/null 2>&1; then
            gh release upload v0.8.0 AURU-Pocket-Core-v0.8.0.apk --repo "$REPO" --clobber
          else
            gh release create v0.8.0 AURU-Pocket-Core-v0.8.0.apk \
              --repo "$REPO" \
              --title "AURU Pocket Core v0.8.0" \
              --notes "AURU Pocket Core v0.8.0 signed Android upgrade package."
          fi
